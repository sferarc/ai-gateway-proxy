packages:
  # changesets lists only these packages, so without "." it cannot find ai-gateway-proxy itself.
  - .
  - examples/*
catalog:
  '@ai-sdk/gateway': 4.0.132
  '@ai-sdk/provider': 4.0.35
  '@ai-sdk/provider-utils': 5.0.72
  '@arethetypeswrong/cli': 0.18.5
  '@biomejs/biome': 2.6.4
  '@changesets/cli': 3.0.3
  '@types/node': 26.6.6
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vercel/oidc': 4.0.5
  ai: 7.0.159
  bunchee: 7.0.2
  dotenv: 18.0.9
  hono: 4.13.16
  is-tree-shakable: 0.5.0
  knip: 6.44.1
  lefthook: 2.2.2
  next: 16.4.5
  react: 19.3.1
  react-dom: 19.3.1
  # bunchee emits declarations through the TypeScript 6 JavaScript API, which TypeScript 7
  # dropped; it looks for this shim by name. src/skill.test.ts type checks with it too.
  typescript: 7.0.2
  '@typescript/typescript6': 6.0.2
  vitest: 5.0.5
catalogMode: strict
cleanupUnusedCatalogs: true
saveExact: true
allowBuilds:
  '@swc/core': false
  esbuild: false
  # lefthook's postinstall fetches its binary.
  lefthook: true
# Security floors carried over from the SferaDev/SferaDev monorepo for the packages this repo resolves.
overrides:
  postcss@<=8.5.17: ^8.5.18
  postcss@<=8.5.22: ^8.5.23
  rollup@>=4.0.0 <4.59.0: ^4.59.0
  undici@>=8.0.0 <8.10.2: ^8.10.2
