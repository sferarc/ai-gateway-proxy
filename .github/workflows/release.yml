name: Release

# Changesets flow: pending changesets on main open a version PR, and merging
# that PR publishes. Nothing runs until the repository variable RELEASE_ENABLED
# is `true`, so the first release from this repository is the owner's decision.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    name: Release
    # A dispatch from any other branch would publish an unreviewed build.
    if: github.ref == 'refs/heads/main' && vars.RELEASE_ENABLED == 'true'
    # Created on first run with no branch policy; main-only waits on sferarc/hq#888.
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # npm trusted publishing exchanges this OIDC token for a publish credential,
      # so no npm token is stored anywhere. Each package's trusted publisher on
      # npmjs.com must name this repository and release.yml.
      id-token: write
    steps:
      # An App token rather than github.token: a version PR merged by the Actions bot
      # pushes to main without triggering this workflow, so it would never publish.
      - name: Mint the sferarc-hq App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.HQ_APP_ID }}
          private-key: ${{ secrets.HQ_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The npm bundled with the Node in mise.toml is the one that publishes, and
      # trusted publishing needs npm 11.5.1 or newer.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - run: pnpm install --frozen-lockfile

      - name: Create version PR or publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: pnpm release
          github-token: ${{ steps.app.outputs.token }}

      # The version PR only carries what `changeset version` generated, so the
      # required checks are the whole review. Merging it publishes.
      - name: Enable auto-merge on the version PR
        if: steps.changesets.outputs.pr-number
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR_NUMBER: ${{ steps.changesets.outputs.pr-number }}
        run: gh pr merge --squash --auto "$PR_NUMBER"
