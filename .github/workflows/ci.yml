name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Public repository, so CI runs on GitHub-hosted runners: public repos get free
# minutes and the self-hosted pool is kept for private repos. Actions are pinned
# to full commit SHAs because the sferarc organisation requires it.

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node and pnpm come from mise.toml, checked against mise.lock.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - run: pnpm install --frozen-lockfile

      # These steps mirror the `check` script in package.json; keep both in sync.
      - name: Lint
        run: pnpm lint

      # CI never commits, so the hooks never run here. This at least fails on a
      # lefthook.yml that lefthook would not load.
      - name: Hook config
        run: pnpm exec lefthook validate

      - name: Unused files, exports and dependencies
        run: pnpm knip

      - name: Typecheck
        run: pnpm typecheck

      # The integration tests call the real gateway and skip without
      # AI_GATEWAY_API_KEY. No key is stored here on purpose: every call costs money.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The example resolves ai-gateway-proxy to dist, so it runs after the build.
      # Typecheck only: running it would call the gateway, and CI has no key.
      - name: Typecheck example
        run: pnpm typecheck:example

      # Consumers rely on unused exports being dropped from their bundles.
      - name: Tree-shakable
        run: pnpm is-tree-shakable

      # CommonJS consumers must resolve the .d.cts declarations, not the ESM ones.
      - name: Package types
        run: pnpm attw

      # High or critical advisories in what the package ships (root importer only, not examples/); accepted ones are in pnpm-workspace.yaml auditConfig.
      - name: Runtime advisories
        run: pnpm --filter . audit --prod --audit-level high
